(function(){
  const SB_URL = "https://mzyvermpfusbbufhjwbu.supabase.co", SB_KEY = "sb_publishable_P_r6pi6oRahzgvfwU-PgeQ_lGecNqwo";

  window.claude = { use: async n => { await loginP; return n === "db" ? DB : n === "user" ? USER : n === "downloads" ? DL : null; } };
  /* ---- database: cache locale + aggiornamenti ogni 15 secondi ---- */
  const cache = new Map(), subs = new Set(); let last = null, LV = "r";

  function applica(rows){ const ch = []; rows.forEach(r => { if (r.ts && (!last || r.ts > last)) last = r.ts; const prima = cache.has(r.path) ? JSON.stringify(cache.get(r.path)) : null;
    if (r.deleted) { if (cache.has(r.path)) { cache.delete(r.path); ch.push(r.path); } } else if (prima !== JSON.stringify(r.data)) { cache.set(r.path, r.data); ch.push(r.path); } }); if (ch.length) notify(ch); }

  function query(coll, filt, ord, lim){ const run = () => { let docs = [...cache.keys()].filter(p => p.startsWith(coll + "/")).map(snapDoc).filter(d => !filt || filt(d.data()));
      if (ord) docs.sort((a, b) => { const x = a.data()[ord[0]], y = b.data()[ord[0]]; return (x < y ? -1 : x > y ? 1 : 0) * (ord[1] === "desc" ? -1 : 1); }); if (lim) docs = docs.slice(0, lim);

  async function entra(nome, p){ try { const r = await rpc("gest_prog_login", { p_nome: nome, p_pin: p }); if (!r.ok) return msg(r.err); LV = r.lv;

.note{font-style:italic;font-size:13.5px}
@media (max-width:560px){.ass{grid-template-columns:1fr}}
.chip{display:inline-block;border-radius:5px;padding:2px 8px;font-weight:600;font-size:13px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;align-self:start;border:1px solid rgb(0 0 0/.12)}
.ngen{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ngen h3,.sec h3{font-family:var(--font-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:var(--accent-ink)}
.ngen p{margin:0;white-space:pre-wrap}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;letter-spacing:.04em;margin-bottom:4px}

/* compilazione */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:960px){.cgrid{grid-template-columns:1fr}}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rp{display:flex;flex-direction:column;gap:12px}
.rph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rph h2{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.rpf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.rpfl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.rpfl .f{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.rpt{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px);min-height:240px}
.rpt table{width:100%;border-collapse:collapse;font-size:13px}
.rpt th{position:sticky;top:0;z-index:1;background:var(--steel);color:var(--on-steel);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;white-space:nowrap}
.rpt td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.rpt tr.nd td{border-top:2px solid var(--steel-2)}
.rpt tbody tr:hover td{background:var(--panel2)}
.rpt .chip{font-size:12px}
.rpc .code{font-size:11.5px}
.rpn{color:var(--muted);font-style:italic}
.rpday{border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.rpday span{text-transform:capitalize;color:var(--accent-ink)}
.rpday:hover{text-decoration:underline}
.rpsame{color:var(--muted);font-size:12px;opacity:.55;white-space:nowrap}
.rpempty{text-align:center;color:var(--muted);padding:24px!important}
@media (max-width:700px){.rpt{max-height:none}.rpt table{min-width:860px}}
.eb{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.eb .ebh{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--steel);border-bottom:3px solid var(--accent);border-radius:10px 10px 0 0}
.eb .ebh .btn.ghost{color:var(--on-steel)}.eb .ebh .btn.ghost:disabled{color:var(--on-steel-muted);opacity:.5}.eb .ebh .btn.danger{color:#ff9a90}
.eb .ebh input{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;background:var(--steel-2);color:#fff;border-color:transparent}
.eb .ebh input::placeholder{color:var(--on-steel-muted);text-transform:none}
.eb .ebh input:focus{border-color:var(--accent);outline:none}
.f{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.f:focus{border-color:var(--accent)}
.ass .kv{font-size:17px;font-weight:700}
.ass .kv small{font-size:12px}
.ass .kvd .note{font-size:17px;font-weight:700;letter-spacing:0}
.ass .kv small{font-weight:400}
.ass .note{font-size:17px;font-weight:700;font-style:normal;color:#1d3a6e;text-transform:uppercase}
.kvd{display:flex;gap:8px;align-items:baseline}.kvd small{flex:none;width:150px;margin-right:0}.kvd .note{flex:1;min-width:0}
.er .nt{text-transform:uppercase}
.er textarea.nt{resize:vertical;min-height:34px;line-height:1.35;font:inherit;display:block}
.er .ra{display:flex;gap:1px;align-items:center}
.eh span:last-child{width:118px!important}
.er .nt::placeholder{text-transform:none}
.rpn{text-transform:uppercase}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ass .note{color:#9dbcf0}}
.ass .chip{font-size:15.5px;padding:3px 9px}
.er{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.25fr) auto;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:start}
.er .pw{display:flex;flex-direction:column;gap:3px;min-width:0}
.er .sw{height:4px;border-radius:2px}
.eh{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.15fr) minmax(0,1fr) minmax(0,1.25fr) auto;gap:6px;padding:6px 10px 0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.eh span:last-child{width:58px}
.ra{display:flex;gap:2px}
.wb{display:flex;flex-direction:column;gap:2px}
.warnb{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;align-self:start}
.ebf{padding:7px 10px;display:flex;gap:6px}
@media (max-width:760px){
  .eh{display:none}
  .er{grid-template-columns:1fr 1fr}
  .er .pw{grid-column:1/-1}
  .er .nt{grid-column:1/-1}
  .er .ra{grid-column:1/-1;justify-content:flex-end}
}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,90px) + 10px)}
.side{max-height:calc(100vh - env(safe-area-inset-top,0px) - var(--toph,90px) - 20px)}
.side .sec.na{flex:1 1 auto;min-height:0;overflow:auto}
@media (max-width:960px){.side{position:static;max-height:none}
  .side .sec.na{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:34vh;margin:0;border-radius:14px 14px 0 0;box-shadow:0 -6px 22px rgb(0 0 0/.18);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .page{padding-bottom:36vh}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sec .chips .chip{cursor:pointer}
textarea.f{resize:vertical;min-height:70px}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}

/* anagrafiche */
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.alist{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow:auto;margin-top:6px}
.ar{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:6px;align-items:center}
.ar .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);text-align:right}
.ar input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.ar select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 4px;font-size:12px}
.ar.c4{grid-template-columns:minmax(0,1fr) auto auto}
.st-INCORSO{color:var(--good)}.st-DAFARE{color:var(--accent-ink)}.st-SOSPESO{color:var(--warn)}.st-CHIUSO{color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--steel);color:var(--on-steel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.blk,.eb{transition:border-color .15s}}
.pin{display:inline-flex;align-items:center;justify-content:center;margin-left:8px;text-decoration:none;font-size:17px;line-height:1;padding:3px 6px;border-radius:6px;background:rgb(255 255 255/.14)}.pin:hover{background:rgb(255 255 255/.3)}.ebh .pin,.kv .pin{background:var(--panel2);border:1px solid var(--line)}
</style>

  <nav class="hnav" id="nav" aria-label="Sezioni">

</header>
<div class="page"><div id="main"></div></div>
<input type="file" id="fileCant" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<datalist id="dlPers"></datalist><datalist id="dlMac"></datalist><datalist id="dlTra"></datalist><datalist id="dlCan"></datalist>
<div class="toast" id="toast" hidden></div>

<script>
const LOGO = document.querySelector(".hrow img").src;
const STATI = ["IN CORSO","DA FARE","SOSPESO","CHIUSO"];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const PAL = ["#f9c98a","#f6dc8c","#a9cdf0","#f8b9b9","#b7d99a","#d4c2ee","#9fdcd3","#f3b58f","#c9d58a","#e8b4d8","#b8c7e8","#e9d3a8","#9cc9a6","#f0a6a0","#c5b39a"];
const S = { db:null, store:"local", canWrite:true, tab:null, view:"cantiere",
  ana:{pers:[],mac:[],tra:[],can:[]}, anaLoaded:false,
  date:null, prog:null, progExists:false, recent:[], lastEdit:0, unsubProg:null, showAllCant:false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const itDate = s => { const d = fromIso(s); return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(); };
const dayName = s => GIORNI[fromIso(s).getDay()];
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const U = s => String(s || "").trim().toUpperCase();
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function setSave(k, txt){ const e = $("#savestate"); e.className = "savestate " + k; e.querySelector("span").textContent = txt; }

/* commessa: "0362.26.PR - COMMITTENTE : DESCRIZIONE" */
function parseCant(label){
  const s = String(label || "").trim().replace(/\s+/g, " ");
  const m = s.match(/(^|[^\d.])(\d{3,4}\.\d{2}(?:\.[A-Z]{1,4})?)(?![\d.])/i);
  let code = "", rest = s;
  if (m) { code = m[2].toUpperCase(); const k = m.index + m[1].length;
    rest = (s.slice(0, k) + " " + s.slice(k + m[2].length)).replace(/\(\s*\)|\[\s*\]/g, " ").replace(/\s*[-–]\s*[-–]\s*/g, " - ").replace(/\s*:\s*:\s*/g, " : ").replace(/\s{2,}/g, " ").trim().replace(/^[\s\-–:·,;/]+|[\s\-–:·,;/]+$/g, ""); }
  const i = rest.indexOf(":");
  const cm = (i >= 0 ? rest.slice(0, i) : rest).trim().replace(/[\s\-–]+$/, "");
  const ds = i >= 0 ? rest.slice(i + 1).trim() : "";
  return { code, cm, ds };
}
/* archiviati: dal dato del programma e, se c'è, dal gestionale che lo contiene (sempre aggiornato) */
function archSet(){ try { if (window.parent !== window && typeof parent.zaPersArch === "function") return new Set(parent.zaPersArch()); } catch {} return new Set(); }
function attivi(){ const a = archSet(); return S.ana.pers.filter(p => !p.arch && p.reparto !== "Ufficio" && !a.has(U(p.nome))); }
/* indirizzo del cantiere (Gestione dati → Commesse, sottoscheda): link a Google Maps */
function mapsURL(label){ if (!label) return ""; const L = (S.ana && S.ana.can) || []; let c = L.find(x => x.label === label);
  if (!c || !c.indirizzo) { const k = parseCant(label).code; if (k) c = L.find(x => x.indirizzo && parseCant(x.label).code === k) || c; }
  if (!c || !c.indirizzo) return ""; const q = [c.indirizzo, c.comune, c.prov].filter(Boolean).join(", "); return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function pinHTML(label){ const u = mapsURL(label); return u ? '<a class="pin" href="'+esc(u)+'" target="_blank" rel="noopener" title="Apri il cantiere in Google Maps" aria-label="Posizione su Google Maps">📍</a>' : ""; }
function persOf(name){ const n = U(name); return S.ana.pers.find(p => U(p.nome) === n); }
function persColor(name){ const p = persOf(name); if (p && p.colore) return p.colore;
  let h = 0; for (const c of U(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return name ? PAL[h % PAL.length] : "#dddddd"; }
function inkFor(hex){ const h = hex.replace("#",""); if (h.length < 6) return "#111";
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#14181a" : "#ffffff"; }
function chip(name){ if (!name) return '<span class="chip" style="background:var(--panel2);color:var(--muted)">—</span>';
  const c = persColor(name); return '<span class="chip" style="background:'+c+';color:'+inkFor(c)+'">'+esc(U(name))+'</span>'; }
/* scritture: passano dal gestionale (oggetti creati nella pagina principale) */
function viaParent(){ try { return window.parent !== window && typeof parent.zaDbSet === "function"; } catch { return false; } }
function dbSet(path, obj){ const j = JSON.stringify(obj); return viaParent() ? parent.zaDbSet(path, j) : S.db.doc(path).set(JSON.parse(j)); }
function dbDel(path){ return viaParent() ? parent.zaDbDel(path) : S.db.doc(path).delete(); }
function autoH(e){ if (!e) return; e.style.height = "auto"; e.style.height = (e.scrollHeight + 2) + "px"; }
/* nome breve della macchina (Gestione dati → Macchine operatrici), solo per il Programma */
function TB(n){ const k = U(n), P = (S.ana && S.ana.trap) || {}; return (P[k] && P[k].b) || k; }
function MB(n){ const k = U(n), P = (S.ana && S.ana.macp) || {}; return (P[k] && P[k].b) || k; }
function emptyProg(d){ return { data:d, blocchi:[], noteGen:"", pronto:false, agg:0 }; }
function normProg(p, d){ const o = Object.assign(emptyProg(d), p || {}); o.blocchi = (o.blocchi||[]).map(b => ({ id:b.id||uid(), cantiere:b.cantiere||"", righe:(b.righe||[]).map(r => ({ id:r.id||uid(), pers:r.pers||"", macc:r.macc||"", trasf:r.trasf||"", note:r.note||"" })) })); return o; }
function progStats(p){ const pers = new Set(); let n = 0; p.blocchi.forEach(b => b.righe.forEach(r => { n++; if (r.pers) pers.add(U(r.pers)); })); return { cant:p.blocchi.filter(b => b.cantiere || b.righe.length).length, ass:n, pers:pers.size }; }

/* ---------------- salvataggio ---------------- */
let progTimer = null, anaTimer = null;
function touchProg(){ S.lastEdit = Date.now(); S.prog.agg = Date.now(); setSave("busy","Salvataggio…"); clearTimeout(progTimer); progTimer = setTimeout(saveProg, 700); }
/* blocco: dalla mezzanotte il programma del giorno (e quelli passati) non si modifica più; solo l'amministratore lo sblocca col lucchetto */
const oggiRoma = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });
const progAdmin = () => { try { return window.parent !== window && typeof parent.zaProgAdmin === "function" && !!parent.zaProgAdmin(); } catch { return false; } };
S.sblocchi = {};
const bloccato = () => !!(S.prog && S.prog.data && S.prog.data <= oggiRoma() && !S.sblocchi[S.prog.data]);
const SAFE_LOCK = new Set(["tab", "goto", "rpGo", "rpReset", "rpXls", "day", "today", "wa", "img", "lockTog"]);
["click", "change", "input"].forEach(ev => document.addEventListener(ev, e => { if (S.tab !== "compila" || !bloccato()) return; const m = document.getElementById("main"); if (!m || !m.contains(e.target)) return;
  const t = e.target.closest ? e.target.closest("[data-act],[data-tab],input,select,textarea,button") : null; if (!t) return;
  if (t.closest(".datebar") || t.id === "dpick" || t.id === "allCant" || (t.dataset && (t.dataset.tab || SAFE_LOCK.has(t.dataset.act)))) return;
  e.preventDefault(); e.stopImmediatePropagation(); if (ev !== "input") toast("Programma bloccato: il giorno è già iniziato." + (progAdmin() ? " Clicca sul lucchetto per sbloccarlo." : " Solo l'amministratore può modificarlo.")); }, true));
function bloccaEditor(){ if (S.tab !== "compila" || !bloccato()) return; const m = document.getElementById("main"); if (!m) return;
  m.querySelectorAll("#editor input, #editor textarea, #editor select, #pronto, #noteGen, [data-act='copyPrev'], [data-act='clear']").forEach(el => { if (el.tagName === "INPUT" && el.type !== "checkbox" || el.tagName === "TEXTAREA") el.readOnly = true; else el.disabled = true; }); }
async function saveProg(){
  if (bloccato()) { toast("Programma bloccato: modifiche non salvate."); return; }
  const p = clone(S.prog);
  try {
    const vuoto = !p.blocchi.length && !String(p.noteGen||"").trim();
    if (vuoto) {
      if (S.db) { if (S.progExists) await dbDel("programmi/"+p.data); }
      else { localStorage.removeItem("zaprog-"+p.data); updLocalRecent(); }
      S.progExists = false;
    } else {
      if (S.db) await dbSet("programmi/"+p.data, p);
      else { localStorage.setItem("zaprog-"+p.data, JSON.stringify(p)); updLocalRecent(); }
      S.progExists = true;
    } setSave("ok", S.db ? "Salvato" : "Salvato solo su questo browser");
  } catch(e){ setSave("err","Non salvato"); toast("Il programma non è stato salvato: "+(e && e.code === "not_granted" ? "non hai i permessi di modifica." : "riprova tra poco.")); }
}
function touchAna(){ setSave("busy","Salvataggio…"); clearTimeout(anaTimer); anaTimer = setTimeout(saveAna, 700); fillLists(); }
async function saveAna(){
  try {
    if (S.db) await dbSet("config/anagrafiche", S.ana);
    else localStorage.setItem("zaprog-ana", JSON.stringify(S.ana));
    setSave("ok", S.db ? "Salvato" : "Salvato solo su questo browser");
  } catch(e){ setSave("err","Non salvato"); toast("Le anagrafiche non sono state salvate."); }
}
function updLocalRecent(){ try { const out = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (/^zaprog-\d{4}-/.test(k)) { const p = JSON.parse(localStorage.getItem(k)); out.push({data:p.data, pronto:!!p.pronto}); } }
  S.recent = out.sort((a,b) => b.data.localeCompare(a.data)).slice(0,14); } catch {} }

/* ---------------- dati ---------------- */
function openDate(d){
  S.date = d; S.prog = emptyProg(d); S.progExists = false;
  if (S.unsubProg) { S.unsubProg(); S.unsubProg = null; }
  if (S.db) {
    S.unsubProg = S.db.doc("programmi/"+d).onSnapshot(snap => {
      if (S.date !== d) return;
      if (Date.now() - S.lastEdit < 3000 && S.tab === "compila") return;
      S.progExists = snap.exists; S.prog = normProg(snap.exists ? snap.data() : null, d);
      if (S.tab === "compila" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#editor")) { refreshSide(); return; }
      render();
    }, () => { setSave("err","Programma non disponibile"); });
  } else {
    try { const raw = localStorage.getItem("zaprog-"+d); if (raw) { S.prog = normProg(JSON.parse(raw), d); S.progExists = true; } } catch {}
  }
  render();
}
async function prevProgram(){
  if (S.db) { const q = await S.db.collection("programmi").where("data","<",S.date).orderBy("data","desc").limit(1).get(); return q.empty ? null : normProg(q.docs[0].data(), q.docs[0].data().data); }
  updLocalRecent(); const r = S.recent.find(x => x.data < S.date); if (!r) return null;
  try { return normProg(JSON.parse(localStorage.getItem("zaprog-"+r.data)), r.data); } catch { return null; }
}
async function defaultDate(){
  const today = iso(new Date());
  try {
    if (S.db) { const q = await S.db.collection("programmi").where("data",">=",today).orderBy("data","asc").limit(1).get(); if (!q.empty) return q.docs[0].data().data; }
    else { updLocalRecent(); const f = S.recent.filter(x => x.data >= today).sort((a,b)=>a.data.localeCompare(b.data))[0]; if (f) return f.data; }
  } catch {}
  return today;
}
function fillLists(){
  const uniq = a => [...new Set(a.map(x => U(x)).filter(Boolean))];
  $("#dlPers").innerHTML = uniq(attivi().map(p => p.nome)).map(v => '<option value="'+esc(v)+'">').join("");
  $("#dlMac").innerHTML = uniq((S.ana.mac || []).filter(n => !(((S.ana.macp || {})[U(n)] || {}).a)).map(MB)).map(v => '<option value="'+esc(v)+'">').join("");
  $("#dlTra").innerHTML = ['<option value="-">'].concat(uniq((S.ana.tra || []).filter(n => !(((S.ana.trap || {})[U(n)] || {}).a)).map(TB)).map(v => '<option value="'+esc(v)+'">')).join("");
  const cs = S.ana.can.filter(c => S.showAllCant || c.stato === "IN CORSO" || c.stato === "DA FARE");
  $("#dlCan").innerHTML = cs.map(c => '<option value="'+esc(c.label)+'">').join("");
}

/* ---------------- riepilogo programmi ---------------- */
S.all = []; S.rf = {};
function rpProgs(){
  if (S.db) return S.all;
  const out = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (/^zaprog-\d{4}-/.test(k)) out.push(JSON.parse(localStorage.getItem(k))); } } catch {}
  return out;
}
function rpAll(){
  const rows = [];
  rpProgs().forEach(p => { if (!p || !p.data) return; (p.blocchi || []).forEach(b => (b.righe || []).forEach(r => {
    const c = parseCant(b.cantiere);
    rows.push({ data:p.data, pers:U(r.pers), cant:String(b.cantiere || "").trim(), code:c.code, cm:c.cm, ds:c.ds, macc:MB(r.macc), trasf:(r.trasf && r.trasf !== "-") ? TB(r.trasf) : "", note:String(r.note || "").trim() });
  })); });
  return rows.sort((a, b) => b.data.localeCompare(a.data) || a.cant.localeCompare(b.cant) || a.pers.localeCompare(b.pers));
}
function rpFiltered(){
  const f = S.rf, has = (v, q) => !q || String(v).toUpperCase().includes(String(q).trim().toUpperCase());
  return rpAll().filter(r => (!f.dal || r.data >= f.dal) && (!f.al || r.data <= f.al) && has(r.pers, f.pers) && has(r.cant, f.cant) && has(r.macc, f.macc) && has(r.trasf, f.trasf) && has(r.note, f.q));
}
function rpGiorno(d){ return '<button class="rpday" data-act="rpGo" data-d="'+d+'" title="Apri il programma di questo giorno"><span>'+dayName(d).slice(0,3)+'</span> '+itDate(d)+'</button>'; }
function rpBody(rows){
  if (!rows.length) return '<tr><td colspan="6" class="rpempty">Nessuna riga corrisponde ai filtri.</td></tr>';
  let prev = ""; const MAX = 1500;
  return rows.slice(0, MAX).map(r => { const nd = r.data !== prev; prev = r.data;
    return '<tr'+(nd ? ' class="nd"' : '')+'><td class="rpd">'+(nd ? rpGiorno(r.data) : '<span class="rpsame">'+itDate(r.data)+'</span>')+'</td><td>'+chip(r.pers)+'</td>'+
      '<td class="rpc">'+(r.code ? '<span class="code">'+esc(r.code)+'</span> ' : '')+'<b>'+esc(r.cm || r.cant || "—")+'</b>'+(r.ds ? ' : '+esc(r.ds) : '')+'</td>'+
      '<td>'+esc(r.macc || "")+'</td><td>'+esc(r.trasf)+'</td><td class="rpn">'+esc(r.note)+'</td></tr>'; }).join("") +
    (rows.length > MAX ? '<tr><td colspan="6" class="rpempty">Mostrate le prime '+MAX+' righe di '+rows.length+': restringi la ricerca o esporta in Excel.</td></tr>' : '');
}
function rpCount(rows){ const g = new Set(rows.map(r => r.data)).size; return rows.length+(rows.length === 1 ? ' riga · ' : ' righe · ')+g+(g === 1 ? ' giorno' : ' giorni'); }
function rpHTML(){
  const all = rpAll(), rows = rpFiltered(), f = S.rf;
  const uq = k => [...new Set(all.map(r => r[k]).filter(Boolean))].sort();
  const fld = (k, lab, ph, list, type) => '<label class="rpfl"><span>'+lab+'</span><input class="f" '+(type ? 'type="'+type+'" ' : 'placeholder="'+ph+'" autocomplete="off" ')+(list ? 'list="'+list+'" ' : '')+'data-rf="'+k+'" value="'+esc(f[k] || "")+'"></label>';
  return '<div class="rp"><div class="rph"><h2>Riepilogo programmi</h2><span class="small muted" id="rpCount">'+rpCount(rows)+'</span><span style="flex:1"></span>'+
    '<button class="btn" data-act="rpReset">Azzera filtri</button><button class="btn pri" data-act="rpXls">Esporta Excel</button></div>'+
    '<div class="rpf">'+fld("dal","Dal","","", "date")+fld("al","Al","","", "date")+fld("pers","Operatore","Cerca operatore…","rpdPers")+fld("cant","Cantiere","Commessa, cliente o cantiere…","rpdCan")+
    fld("macc","Mezzo","Cerca mezzo…","rpdMac")+fld("trasf","Trasferimento","Cerca trasferimento…","rpdTra")+fld("q","Descrizione","Cerca nella descrizione…","")+'</div>'+
    '<datalist id="rpdPers">'+uq("pers").map(v => '<option value="'+esc(v)+'">').join("")+'</datalist><datalist id="rpdCan">'+uq("cant").map(v => '<option value="'+esc(v)+'">').join("")+'</datalist>'+
    '<datalist id="rpdMac">'+uq("macc").map(v => '<option value="'+esc(v)+'">').join("")+'</datalist><datalist id="rpdTra">'+uq("trasf").map(v => '<option value="'+esc(v)+'">').join("")+'</datalist>'+
    '<div class="rpt"><table><thead><tr><th style="width:150px">Giorno</th><th style="width:210px">Operatore</th><th>Cantiere</th><th style="width:190px">Mezzo</th><th style="width:170px">Trasferimento</th><th>Descrizione</th></tr></thead><tbody id="rpBody">'+rpBody(rows)+'</tbody></table></div></div>';
}
function rpRefresh(){ const b = $("#rpBody"); if (!b) return; const rows = rpFiltered(); b.innerHTML = rpBody(rows); const c = $("#rpCount"); if (c) c.textContent = rpCount(rows); }
async function rpExport(){
  const rows = rpFiltered(); if (!rows.length) { toast("Nessuna riga da esportare."); return; }
  if (!window.XLSX) { toast("Libreria Excel non disponibile: riprova tra poco."); return; }
  const aoa = [["GIORNO","DATA","OPERATORE","COMMESSA","CLIENTE","CANTIERE","MEZZO","TRASFERIMENTO","DESCRIZIONE"]].concat(rows.map(r => {
    const [y, m, d] = r.data.split("-").map(Number); return [dayName(r.data).toUpperCase(), new Date(Date.UTC(y, m-1, d)), r.pers, r.code, r.cm, r.ds || (r.code ? "" : r.cant), r.macc, r.trasf, U(r.note)]; }));
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates:true, dateNF:"dd/mm/yyyy" });
  ws["!cols"] = [10,12,26,13,28,40,26,22,50].map(w => ({ wch:w })); ws["!autofilter"] = { ref:"A1:I"+aoa.length };
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Riepilogo programmi");
  const buf = XLSX.write(wb, { type:"array", bookType:"xlsx" });
  const name = "Riepilogo programmi "+itDate(iso(new Date())).replace(/\./g,"-")+".xlsx", type = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  try { if (window.parent !== window && typeof parent.zaSaveFile === "function") { await parent.zaSaveFile(name, buf, type); return; } } catch(e) { console.warn(e); }
  const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({ filename:name, data:new Blob([buf], { type }) }); } catch(e) { if (e && e.code !== "declined") toast("Excel non salvato."); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
}

/* ---------------- render ---------------- */
function setTab(t){
  if (!S.canWrite && t !== "programma" && t !== "riepilogo") t = "programma";
  S.tab = t;
  document.querySelectorAll("#nav .hbtn").forEach(b => { b.classList.toggle("on", b.dataset.tab === t); if (b.dataset.w !== undefined) b.hidden = !S.canWrite; });
  render();
}
function render(){
  if (!S.tab || !S.prog) return;
  const m = $("#main");
  if (S.tab === "programma") m.innerHTML = '<div class="col">'+dateBar(false)+viewHTML()+'</div>';
  else if (S.tab === "compila") { m.innerHTML = '<div class="wide">'+editHTML()+'</div>'; m.querySelectorAll("textarea.nt").forEach(autoH); bloccaEditor(); }
  else if (S.tab === "riepilogo") { m.innerHTML = '<div class="wide">'+rpHTML()+'</div>'; }
  else m.innerHTML = '<div class="wide">'+anaHTML()+'</div>';
}
function dateBar(edit){
  const chips = S.recent.filter(r => r.data !== S.date).slice(0, 8).map(r => '<button class="dchip'+(r.pronto?'':' draft')+'" data-act="goto" data-d="'+r.data+'" title="'+(r.pronto?'Pronto':'Bozza')+'">'+dayName(r.data).slice(0,3)+' '+itDate(r.data).slice(0,5)+'</button>').join("");
  return '<div class="datebar"><button class="btn ic" data-act="day" data-n="-1" aria-label="Giorno precedente">‹</button>'+
    '<input type="date" id="dpick" value="'+S.date+'" aria-label="Data del programma">'+
    '<button class="btn ic" data-act="day" data-n="1" aria-label="Giorno successivo">›</button>'+
    '<button class="btn sm ghost" data-act="today">Oggi</button><button class="btn sm ghost" data-act="tomorrow">Domani</button>'+
    (chips ? '<span class="chips" style="margin-left:auto">'+chips+'</span>' : '')+'</div>';
}
function viewHTML(){

  return h;
}

/* ---- compilazione ---- */
function conflicts(){
  const pc = new Map(), mc = new Map();
  S.prog.blocchi.forEach(b => b.righe.forEach(r => {
    const code = parseCant(b.cantiere).code || parseCant(b.cantiere).cm || "?";
    if (r.pers) { const k = U(r.pers); if (!pc.has(k)) pc.set(k, new Set()); pc.get(k).add(code); }
    const mk = U(r.macc); if (mk && !/NOLO|COMMITTENTE/.test(mk)) { if (!mc.has(mk)) mc.set(mk, new Set()); mc.get(mk).add(code); }
  }));
  return { pc, mc };
}
function rowWarn(b, r, cf){
  const code = parseCant(b.cantiere).code || parseCant(b.cantiere).cm || "?"; const out = [];
  const ps = r.pers && cf.pc.get(U(r.pers)); if (ps && ps.size > 1) out.push("Anche su " + [...ps].filter(x => x !== code).join(", "));
  const ms = r.macc && cf.mc.get(U(r.macc)); if (ms && ms.size > 1) out.push("Mezzo anche su " + [...ms].filter(x => x !== code).join(", "));
  return out.map(w => '<span class="warnb">'+esc(w)+'</span>').join("");
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab) { location.hash = t.dataset.tab; setTab(t.dataset.tab); return; }
  const a = t.dataset.act, P = S.prog;
  const bEl = t.closest("[data-b]"), b = bEl && findB(bEl.dataset.b);
  const rEl = t.closest("[data-r]"), ri = b && rEl ? b.righe.findIndex(r => r.id === rEl.dataset.r) : -1;
  switch (a) {
    case "tab": e.preventDefault(); location.hash = t.dataset.t; setTab(t.dataset.t); return;
    case "goto": openDate(t.dataset.d); return;
    case "rpGo": location.hash = "programma"; setTab("programma"); openDate(t.dataset.d); return;
    case "rpReset": S.rf = {}; render(); return;
    case "rpXls": rpExport(); return;
    case "day": { let d = addDays(S.date, +t.dataset.n); if (fromIso(d).getDay() === 0) d = addDays(d, +t.dataset.n); openDate(d); return; }
    case "today": openDate(iso(new Date())); return;
    case "tomorrow": { let d = addDays(iso(new Date()), 1); if (fromIso(d).getDay() === 0) d = addDays(d, 1); openDate(d); return; }
    case "view": S.view = t.dataset.v; render(); return;
    case "lockTog": { if (!progAdmin()) return; const d = S.prog.data; S.sblocchi[d] = !S.sblocchi[d]; toast(S.sblocchi[d] ? "Programma sbloccato: ora puoi modificarlo (solo tu)." : "Programma bloccato di nuovo."); render(); return; }
    case "wa": copyWA(); return;
    case "img": saveImage(); return;
    case "bAdd": P.blocchi.push({ id:uid(), cantiere:"", righe:[{ id:uid(), pers:"", macc:"", trasf:"", note:"" }] }); touchProg(); render(); setTimeout(() => { const l = document.querySelectorAll('#editor [data-fb="cantiere"]'); l[l.length-1]?.focus(); }, 0); return;
    case "bDel": P.blocchi = P.blocchi.filter(x => x !== b); touchProg(); render(); return;
    case "bUp": case "bDown": { const i = P.blocchi.indexOf(b), j = i + (a === "bUp" ? -1 : 1); [P.blocchi[i], P.blocchi[j]] = [P.blocchi[j], P.blocchi[i]]; touchProg(); render(); return; }
    case "rAdd": b.righe.push({ id:uid(), pers:"", macc:"", trasf:"", note:"" }); touchProg(); render(); setTimeout(() => { const l = document.querySelectorAll('[data-b="'+b.id+'"] [data-f="pers"]'); l[l.length-1]?.focus(); }, 0); return;
    case "rDup": b.righe.splice(ri+1, 0, Object.assign(clone(b.righe[ri]), { id:uid(), pers:"" })); touchProg(); render(); return;
    case "rDel": b.righe.splice(ri, 1); touchProg(); render(); return;
    case "rUp": case "rDown": { const j = a === "rUp" ? ri-1 : ri+1; if (ri < 0 || j < 0 || j >= b.righe.length) return; [b.righe[ri], b.righe[j]] = [b.righe[j], b.righe[ri]]; touchProg(); render(); return; }
    case "addPers": { if (!P.blocchi.length) P.blocchi.push({ id:uid(), cantiere:"", righe:[] }); const lb = P.blocchi[P.blocchi.length-1];
      const emptyRow = lb.righe.find(r => !r.pers); if (emptyRow) emptyRow.pers = U(t.dataset.n); else lb.righe.push({ id:uid(), pers:U(t.dataset.n), macc:"", trasf:"", note:"" }); touchProg(); render(); return; }
    case "copyPrev": { const pp = await prevProgram().catch(() => null); if (!pp) { toast("Non c'è un programma precedente da copiare."); return; }
      const keep = P.blocchi.length; P.blocchi = pp.blocchi.map(x => ({ id:uid(), cantiere:x.cantiere, righe:x.righe.map(r => Object.assign({}, r, { id:uid() })) }));
      if (!P.noteGen) P.noteGen = ""; P.pronto = false; touchProg(); render(); toast("Copiato il programma di "+dayName(pp.data)+" "+itDate(pp.data)+(keep ? " al posto di quello che c'era." : ".")); return; }
    case "clear": $("#clearAsk").innerHTML = '<div class="notice row">Svuotare il programma di questo giorno? <button class="btn sm danger" data-act="clearYes">Svuota</button><button class="btn sm ghost" data-act="clearNo">Annulla</button></div>'; return;
    case "clearYes": P.blocchi = []; P.noteGen = ""; P.pronto = false; touchProg(); render(); return;
    case "clearNo": $("#clearAsk").innerHTML = ""; return;
    case "pAdd": { const v = U($("#add-pers").value); if (!v) return; if (persOf(v)) { toast(v+" è già in elenco."); return; } S.ana.pers.push({ nome:v, colore:persColor(v), tipo:"Dipendente" }); touchAna(); render(); $("#add-pers")?.focus(); return; }
    case "cAdd": { const v = $("#add-can").value.trim(); if (!v) return; S.ana.can.unshift({ label:v, stato:"IN CORSO" }); touchAna(); render(); return; }
    case "aAdd": { const k = t.dataset.k, inp = $("#add-"+k), v = U(inp.value); if (!v) return; S.ana[k].push(v); touchAna(); render(); $("#add-"+k)?.focus(); return; }
    case "aDel": { const ar = t.closest(".ar"); S.ana[ar.dataset.k].splice(+ar.dataset.i, 1); touchAna(); render(); return; }
    case "aUp": { const ar = t.closest(".ar"), arr = S.ana[ar.dataset.k], i = +ar.dataset.i; [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; touchAna(); render(); return; }
    case "impCant": $("#fileCant").click(); return;
  }
});

/* elenchi a discesa: entrando in una casella già compilata si vede tutto l'elenco (il valore resta come suggerimento grigio) */

  const t = e.target;
  if (t.id === "dpick" && t.value) { openDate(t.value); return; }
  if (t.id === "pronto") { S.prog.pronto = t.checked; touchProg(); toast(t.checked ? "Segnato come pronto per la squadra." : "Tornato in bozza."); return; }
  if (t.id === "allCant") { S.showAllCant = t.checked; fillLists(); return; }
  if (t.closest("#editor") && (t.dataset.f === "pers" || t.dataset.f === "macc" || t.dataset.f === "trasf")) {
    t.value = U(t.value);
    const b = findB(t.closest("[data-b]").dataset.b); const r = b.righe.find(x => x.id === t.closest("[data-r]").dataset.r); r[t.dataset.f] = t.value;
    touchProg(); refreshWarn(); refreshSide(); return;
  }
  const ar = t.closest(".ar");
  if (ar && ar.dataset.k === "pers" && t.dataset.af === "nome" && !t.value.trim()) { S.ana.pers.splice(+ar.dataset.i, 1); touchAna(); render(); }
});
$("#fileCant").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (!window.XLSX) { toast("Lettura Excel non disponibile: ricarica la pagina."); return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type:"array" });
    const names = [...wb.SheetNames].sort((a,b) => (U(b)==="GENERALE") - (U(a)==="GENERALE"));
    const found = new Set();
    for (const sn of names) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:"" });
      let col = -1, start = 0;
      for (let i = 0; i < Math.min(rows.length, 15) && col < 0; i++) { const j = rows[i].findIndex(c => U(c) === "CANTIERE" || U(c) === "COMMESSA"); if (j >= 0) { col = j; start = i+1; } }
      if (col < 0) continue;
      for (let i = start; i < rows.length; i++) { const v = String(rows[i][col] || "").trim(); if (v) found.add(v); }
      if (found.size) break;
    }
    if (!found.size) { toast("Nel file non ho trovato una colonna CANTIERE."); return; }
    const have = new Set(S.ana.can.map(c => U(c.label)));
    const nuovi = [...found].filter(v => !have.has(U(v))).sort((a,b) => b.localeCompare(a,"it",{numeric:true}));
    nuovi.forEach(v => S.ana.can.push({ label:v, stato:"IN CORSO" }));
    touchAna(); render(); toast(nuovi.length ? "Aggiunti "+nuovi.length+" cantieri, stato In corso." : "Tutti i cantieri del file erano già in elenco.");
  } catch(err){ toast("Non riesco a leggere questo file Excel."); }
});
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["programma","compila","riepilogo","anagrafiche"].includes(h) && h !== S.tab) setTab(h); });

/* ---------------- condivisione ---------------- */
function waText(){
  const p = S.prog; const L = ["*ZA srl · PROGRAMMA DI "+dayName(p.data).toUpperCase()+" "+itDate(p.data)+"*"];
  p.blocchi.forEach(b => { if (!b.righe.length && !b.cantiere) return; const c = parseCant(b.cantiere);
    L.push(""); L.push("*"+(c.code ? c.code+" · " : "")+(c.cm || "CANTIERE DA INDICARE")+"*"); if (c.ds) L.push(c.ds); { const u = mapsURL(b.cantiere); if (u) L.push("📍 " + u); }
    b.righe.forEach(r => { const parts = [U(r.pers) || "—"]; if (r.macc) parts.push(MB(r.macc)); if (r.trasf && r.trasf !== "-") parts.push("trasf. "+TB(r.trasf));
      L.push("• "+parts.join(" · ")); if (r.note) L.push("   Descrizione lavori : *"+U(r.note.trim())+"*"); }); });
  if (p.noteGen) { L.push(""); L.push("*NOTE GENERALI*"); L.push(p.noteGen.trim()); }
  return L.join("\n");
}
async function copyWA(){
  const txt = waText();
  try { await navigator.clipboard.writeText(txt); toast("Testo copiato: incollalo nel gruppo WhatsApp."); }
  catch { const ta = document.createElement("textarea"); ta.value = txt; ta.className = "f"; ta.rows = 10; ta.style.marginTop = "8px";
    const m = $("#main .col") || $("#side"); m.prepend(ta); ta.select(); toast("Seleziona il testo e copialo a mano."); }
}
async function saveImage(){
  try { if (window.parent !== window && typeof parent.zaSaveFile === "function") { try { await document.fonts.ready; } catch {}
    const bl = await drawImage(); if (!bl) { toast("Immagine non generata."); return; }
    await parent.zaSaveFile("Programma "+itDate(S.prog.data)+".png", await bl.arrayBuffer(), "image/png"); return; } } catch(e) { console.warn(e); }
  const dl = window.claude?.use ? await claude.use("downloads").catch(() => null) : null;
  if (!dl) { toast("Il salvataggio dell'immagine non è disponibile qui. Usa Copia per WhatsApp."); return; }
  try { await document.fonts.ready; } catch {}
  const blob = await drawImage();
  try { await dl.save({ filename:"Programma "+itDate(S.prog.data)+".png", data:blob }); }
  catch(e){ if (e && e.code !== "declined" && e.code !== "cancelled") toast("Immagine non salvata."); }
}
function drawImage(){
  return new Promise(res => {
    const W = 1080, PAD = 40, p = S.prog;
    const c = document.createElement("canvas"), x = c.getContext("2d");
    const F = (w, s, f) => w+" "+s+"px "+(f || '"IBM Plex Sans", Arial, sans-serif');
    const wrap = (t, maxW, font) => { x.font = font; const out = []; String(t).split("\n").forEach(par => { let line = ""; par.split(" ").forEach(w => { const tr = line ? line+" "+w : w; if (x.measureText(tr).width > maxW && line) { out.push(line); line = w; } else line = tr; }); out.push(line); }); return out; };
    const ops = []; let y = 0;
    const push = (h, fn) => { const yy = y; ops.push(() => fn(yy)); y += h; };
    push(130, yy => { x.fillStyle = "#26393d"; x.fillRect(0, yy, W, 130); x.fillStyle = "#d4950f"; x.fillRect(0, yy+126, W, 4); });
    push(20, () => {});
    const title = "PROGRAMMA DI "+dayName(p.data).toUpperCase()+" "+itDate(p.data);
    push(74, yy => { x.fillStyle = "#f4f08a"; x.fillRect(PAD, yy, W-2*PAD, 62); x.fillStyle = "#1c2320"; x.font = F(700, 38, '"Barlow Condensed", Arial Narrow, sans-serif'); x.textBaseline = "middle"; x.fillText(title, PAD+18, yy+32); });
    p.blocchi.forEach(b => { if (!b.righe.length && !b.cantiere) return; const cc = parseCant(b.cantiere);
      x.font = F(600, 24, '"IBM Plex Mono", monospace'); const cw = cc.code ? x.measureText(cc.code).width + 22 : 0;
      const head = wrap(U((cc.cm || "CANTIERE DA INDICARE") + (cc.ds ? " : "+cc.ds : "")), W-2*PAD-40-(cw ? cw+14 : 0), F(700, 26));
      const hh = 26 + head.length*34;
      push(hh, yy => { x.fillStyle = "#26393d"; x.fillRect(PAD, yy, W-2*PAD, hh); x.fillStyle = "#d4950f"; x.fillRect(PAD, yy+hh-4, W-2*PAD, 4); x.textBaseline = "top";
        let tx = PAD+16; if (cw) { x.fillStyle = "#d4950f"; x.fillRect(tx, yy+11, cw, 36); x.fillStyle = "#1c2320"; x.font = F(600, 24, '"IBM Plex Mono", monospace'); x.textBaseline = "middle"; x.fillText(cc.code, tx+11, yy+30); x.textBaseline = "top"; tx += cw+14; }
        x.fillStyle = "#ffffff"; x.font = F(700, 26); head.forEach((l, i) => x.fillText(l, tx, yy+14+i*34)); });
      b.righe.forEach(r => {
        const LBS = ["MEZZO :", "TRASFERIMENTO :", "DESCRIZIONE LAVORI :"]; x.font = F(600, 17); const LW = Math.max(...LBS.map(t => x.measureText(t).width)) + 14, VW = W-2*PAD-330-LW;
        const items = []; if (r.macc) items.push([LBS[0], wrap(MB(r.macc), VW, F(700, 24)), F(700, 24), "#1c2320"]);
        if (r.trasf && r.trasf !== "-") items.push([LBS[1], wrap(TB(r.trasf), VW, F(700, 24)), F(700, 24), "#1c2320"]);
        if (r.note) items.push([LBS[2], wrap(U(r.note), VW, F(700, 24)), F(700, 24), "#1d3a6e"]);
        const nLines = items.reduce((a, it) => a + it[1].length, 0);
        const rh = Math.max(56, 16 + nLines*31 + 12);
        push(rh, yy => { x.fillStyle = "#ffffff"; x.fillRect(PAD, yy, W-2*PAD, rh); x.fillStyle = "#d8dcd6"; x.fillRect(PAD, yy+rh-1, W-2*PAD, 1);
          const col = persColor(r.pers); x.fillStyle = col; x.fillRect(PAD+12, yy+12, 290, 34); x.fillStyle = inkFor(col); x.font = F(600, 21); x.textBaseline = "middle";
          let nm = U(r.pers) || "—"; while (x.measureText(nm).width > 272 && nm.length > 3) nm = nm.slice(0, -2)+"…"; x.fillText(nm, PAD+22, yy+30);
          x.textBaseline = "top"; let k = 0;
          items.forEach(([lb, lines, font, colr]) => lines.forEach((l, i) => { const yl = yy+14+k*31; if (i === 0) { x.fillStyle = "#5b665f"; x.font = F(600, 17); x.fillText(lb, PAD+320, yl+5); } x.fillStyle = colr; x.font = font; x.fillText(l, PAD+320+LW, yl); k++; })); });
      });
      push(18, () => {});
    });
    if (p.noteGen) { const nl = wrap(p.noteGen, W-2*PAD-30, F(400, 22)); const nh = 56 + nl.length*28;
      push(nh, yy => { x.fillStyle = "#f6e7c4"; x.fillRect(PAD, yy, W-2*PAD, nh); x.fillStyle = "#7a5000"; x.textBaseline = "top"; x.font = F(700, 26, '"Barlow Condensed", Arial Narrow, sans-serif'); x.fillText("NOTE GENERALI", PAD+15, yy+12);
        x.fillStyle = "#1c2320"; x.font = F(400, 22); nl.forEach((l, i) => x.fillText(l, PAD+15, yy+44+i*28)); }); }
    push(30, () => {});
    c.width = W; c.height = y; x.fillStyle = "#f2f3f0"; x.fillRect(0, 0, W, y);
    ops.forEach(f => f());
    const img = new Image();
    img.onload = () => { const h = 96, w = img.width * h / img.height; x.drawImage(img, PAD, 16, w, h);
      x.fillStyle = "#e8e22a"; x.font = F(700, 44, '"Barlow Condensed", Arial Narrow, sans-serif'); x.textBaseline = "middle"; x.fillText("PROGRAMMA CANTIERI", PAD + w + 30, 64);
      c.toBlob(res, "image/png"); };
    img.onerror = () => c.toBlob(res, "image/png");
    img.src = LOGO;
  });
}

(function(){ const h = document.querySelector("header.top"); const set = () => document.documentElement.style.setProperty("--toph", h.offsetHeight + "px"); set(); try { new ResizeObserver(set).observe(h); } catch {} })();
async function start(){
  const hash = location.hash.slice(1);
  S.tab = null; render();
  $("#main").innerHTML = '<div class="col"><div class="empty"><b>Caricamento del programma…</b>Un momento.</div></div>';
  let db = null; try { if (window.parent !== window && typeof parent.zaGetDb === "function") db = await parent.zaGetDb(); } catch {}
  if (!db) db = window.claude?.use ? await claude.use("db").catch(() => null) : null;
  const user = window.claude?.use ? await claude.use("user").catch(() => null) : null;
  if (db) {
    S.db = db; S.store = "db";
    let can = null; try { can = user ? await user.can("data.write") : null; } catch {}
    S.canWrite = can !== false;
    try { if (window.parent !== window && typeof parent.zaProgWrite === "function") S.canWrite = S.canWrite && !!parent.zaProgWrite(); } catch {}
    setSave("ok", S.canWrite ? "Collegato" : "Sola lettura");
    db.doc("config/anagrafiche").onSnapshot(s => {
      const d = s.exists ? s.data() : {};
      if (Date.now() - S.lastAnaEdit < 3000) return;
      S.ana = { ...d, pers:(d.pers||[]).map(p => typeof p === "string" ? { nome:p } : p), mac:d.mac||[], tra:d.tra||[], can:(d.can||[]).map(c => typeof c === "string" ? { label:c, stato:"IN CORSO" } : c), imp:d.imp||null };
      S.anaLoaded = true; fillLists();
      if (S.tab === "anagrafiche" && document.activeElement && document.activeElement.closest(".agrid")) return;
      if (S.tab === "compila" && document.activeElement && document.activeElement.closest("#editor")) { refreshSide(); return; }
      render();
    });
    db.collection("programmi").onSnapshot(q => { S.all = q.docs.map(d => d.data()); if (S.tab === "riepilogo") rpRefresh(); });
    db.collection("programmi").orderBy("data","desc").limit(20).onSnapshot(q => { S.recent = q.docs.map(d => ({ data:d.data().data, pronto:!!d.data().pronto })); if (S.tab === "programma") render(); else { const db2 = document.querySelector(".datebar .chips"); if (db2 && !document.activeElement?.closest("#editor")) render(); } });
  } else {
    S.store = "local"; setSave("ok", "Salvato solo su questo browser");
    try { const a = JSON.parse(localStorage.getItem("zaprog-ana") || "null"); if (a) S.ana = a; } catch {}
    updLocalRecent(); fillLists();
  }
  const d = await defaultDate();
  S.tab = ["programma","compila","riepilogo","anagrafiche"].includes(hash) ? hash : (S.canWrite && S.db ? "compila" : "programma");
  if (!S.canWrite && S.tab !== "riepilogo") S.tab = "programma";
  setTab(S.tab);
  openDate(d);
}
S.lastAnaEdit = 0;
const _touchAna = touchAna; touchAna = function(){ S.lastAnaEdit = Date.now(); _touchAna(); };
start();
