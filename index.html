<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>ZA srl Rapportini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f3f0; --panel:#ffffff; --panel2:#f7f8f5; --ink:#1c2320; --muted:#5b665f; --line:#d8dcd6;
  --steel:#26393d; --steel-2:#304a4f; --on-steel:#eef3f1; --on-steel-muted:#a9bcb8;
  --accent:#d4950f; --accent-ink:#7a5000; --accent-soft:#f6e7c4; --band:#f4f08a;
  --good:#2c7a4b; --good-soft:#dcefe2; --warn:#a96300; --warn-soft:#f7e6cc; --bad:#b0352d; --bad-soft:#f6dcd9; --blue:#1d3a6e;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif; --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121614; --panel:#1b201e; --panel2:#171c1a; --ink:#e4eae6; --muted:#97a39c; --line:#2d3532;
  --steel:#1d2e31; --steel-2:#253b3f; --on-steel:#e4eeeb; --on-steel-muted:#8fa6a1;
  --accent:#e2a92e; --accent-ink:#f0c46a; --accent-soft:#3a2f17; --good:#5cc08a; --good-soft:#1f3a2a; --warn:#e0a24a; --warn-soft:#3a2c17; --bad:#ef7d72; --bad-soft:#3a1f1d; --blue:#9dbcf0;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--steel);color:var(--on-steel);border-bottom:3px solid var(--accent);padding:10px 16px calc(10px) 16px;padding-top:max(10px, env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header .b{font-weight:700;font-size:21px;color:#e8e22a;letter-spacing:.01em}
header .s{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-steel-muted)}
header .me{margin-left:auto;text-align:right;font-size:13px;line-height:1.2}
header .me b{display:block;font-size:14px;color:#fff;text-transform:uppercase}
header .me button{background:none;border:0;color:var(--on-steel-muted);padding:0;font-size:12px;text-decoration:underline}
main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 12px}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;color:var(--accent-ink)}
label.l{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
.f{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:11px 12px;min-height:46px}
.f:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.f{min-height:96px;resize:vertical;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font:inherit;font-size:16px;line-height:1.3;color:var(--ink);white-space:normal;cursor:pointer}
.sug button:last-child{border-bottom:0}
.sug button:active,.sug button.on{background:var(--good-soft)}
.sug .c1{display:block;font-weight:700;font-size:15px;color:var(--accent)}
.sug .c2{display:block;font-weight:600}
.sug mark{background:#f3e27a;color:inherit;border-radius:2px;padding:0 1px}
.sug .vuoto{padding:12px 14px;color:var(--muted)}
.sugw{position:relative}
textarea.f.grow{resize:none;overflow:hidden;min-height:0;line-height:1.3;display:block}
.dataNav{display:flex;gap:8px;align-items:stretch}
.assenze{display:flex;gap:10px;margin:10px 0 4px}
.assenze > label{flex:1 1 0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:56px;font-weight:700;cursor:pointer}
.assenze small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.assenze input[type=checkbox]{width:26px;height:26px;accent-color:var(--blue);flex:0 0 auto}
.assenze .ferie.on{background:#dfe8f7;border-color:var(--blue);color:var(--blue)}
.assenze .perm .f{flex:0 0 80px;width:80px;text-align:center;margin:0;padding:8px}
.assenze .perm span{flex:1 1 auto}
.ferieBox{color:var(--blue);background:#dfe8f7;border-color:var(--blue);text-align:center;font-size:16px}
.mzR,.accR{align-items:flex-start !important}
.mzR,.accR{gap:6px !important}
.mzR .x,.accR .x{width:34px !important}
.accR{margin-left:12px;padding-left:10px;border-left:3px solid var(--accent)}
.mzR .oreI,.accR .oreI{flex:0 0 58px;width:58px;text-align:center;padding-left:6px;padding-right:6px}
.accR{align-items:center}
.addRow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 12px}
.addAc.mz{border-style:solid;border-color:var(--steel);font-weight:700}
.addAc.mz b{background:var(--steel);color:#e8e22a}
.mzN{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.addAc{display:inline-flex;align-items:center;gap:6px;margin:0;background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);min-height:38px}
.addAc b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1d1606;font-size:16px;line-height:1}
.accR .accL{flex:0 0 46px;align-self:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-left:14px;position:relative}
.accR .accL::before{content:"";position:absolute;left:2px;top:-10px;width:8px;height:16px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:4px}
.accR .sugw{flex:1 1 auto}
.lavz{display:inline-block;margin-top:5px;background:var(--steel);color:var(--on-steel);border-radius:5px;padding:2px 8px;font-size:13px;font-weight:700;letter-spacing:.03em}
.permR{color:var(--warn);font-weight:700;margin-top:4px}
.calTog{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;color:var(--ink);margin-bottom:10px;text-align:left}
.calTog .car{margin-left:auto;color:var(--muted)}
.calTog.on{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.cal{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 12px;margin-bottom:14px}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calh b{flex:1;text-align:center;text-transform:capitalize;font-size:18px}
.calh .dnav{flex:0 0 46px;min-height:40px;font-size:22px}
.cgr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cgr .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cg{position:relative;aspect-ratio:1/1;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:inherit;font-weight:700;font-size:16px;color:var(--ink);padding:0}
.cg i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px}
.cg.ok{background:var(--good);border-color:var(--good);color:#fff}
.cg.manca{background:var(--bad);border-color:var(--bad);color:#fff}
.cg.fer{background:var(--blue);border-color:var(--blue);color:#fff}
.cg.perm{background:var(--warn);border-color:var(--warn);color:#fff}
.cg.ok.perm{background:var(--good);box-shadow:inset 0 -5px 0 var(--warn)}
.cg.off{background:transparent;color:var(--muted);border-style:dashed;opacity:.7}
.cg.fut{color:var(--muted);opacity:.45}
.cg.old{color:var(--muted)}
.cg.oggi{outline:3px solid var(--accent);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.leg i.ok{background:var(--good)}.leg i.manca{background:var(--bad)}.leg i.fer{background:var(--blue)}.leg i.perm{background:var(--warn)}.leg i.off{border:1px dashed var(--muted)}
.dataNav .f{flex:1 1 auto;min-width:0;text-align:center;font-weight:600}
.dnav{flex:0 0 54px;font-size:26px;line-height:1;padding:0;font-weight:700}
.dnav:disabled{opacity:.35}
.dGiorno{text-align:center;font-weight:600;color:var(--muted);margin:6px 0 4px;font-size:14px}
.row > *{flex:1 1 0;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1d1606}
.btn.big{width:100%;font-size:18px;min-height:54px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:12px}
.ok{background:var(--good-soft);color:var(--good)}
.tot{display:flex;justify-content:space-between;align-items:baseline;background:var(--band);color:#1c2320;border-radius:8px;padding:10px 14px;margin-top:12px;font-weight:700}
.tot b{font-family:var(--font-display);font-size:28px}
.sub{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--panel2)}
.sub .row{margin-top:6px}
.x{flex:0 0 auto !important;width:44px;min-height:44px;border:0;background:none;color:var(--bad);font-size:20px}
.rap{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden;color:var(--ink)}
.rap .h{background:var(--steel);color:var(--on-steel);padding:9px 12px;display:flex;gap:8px;align-items:center;border-bottom:3px solid var(--accent)}
.rap .h .d{font-weight:700;text-transform:capitalize}
.rap .h .o{margin-left:auto;font-family:var(--font-display);font-size:20px;font-weight:700;color:#e8e22a}
.rap .c{padding:10px 12px}
.rap .c .cm{font-weight:700;text-transform:uppercase}
.rap .c .ds{color:var(--blue);font-weight:700;text-transform:uppercase;margin-top:4px}
.chip{display:inline-block;border-radius:5px;padding:2px 8px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.wait{background:var(--accent-soft);color:var(--accent-ink)}
.code{font-family:var(--font-mono);font-size:12.5px;font-weight:500;background:var(--accent);color:#1c2320;border-radius:4px;padding:1px 6px;margin-right:6px}
.fab{position:fixed;left:16px;right:16px;bottom:max(16px, env(safe-area-inset-bottom));max-width:688px;margin:0 auto;z-index:6;box-shadow:0 6px 20px rgb(0 0 0/.18)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--steel);color:var(--on-steel);padding:10px 16px;border-radius:8px;z-index:9;max-width:90vw;text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pinpad button{min-height:58px;font-size:24px;font-weight:600;border:1px solid var(--line);background:var(--panel);border-radius:10px;color:var(--ink)}
.pindots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--accent);border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
[hidden]{display:none !important}
</style>

<body>
<header>
  <div><div class="b">ZA srl</div><div class="s">Rapportini</div></div>
  <div class="me" id="me" hidden></div>
</header>
<main id="main"><div class="empty">Caricamento…</div></main>
<button class="btn pri big fab" id="fab" hidden>+ Nuovo rapportino</button>
<div class="toast" id="toast" hidden></div>
<datalist id="dlCan"></datalist><datalist id="dlMez"></datalist>
<script>
"use strict";
/* Collegamento a Supabase: solo le funzioni dei rapportini (la chiave pubblica non dà accesso ad altro) */
const SB_URL = "https://mzyvermpfusbbufhjwbu.supabase.co", SB_KEY = "sb_publishable_P_r6pi6oRahzgvfwU-PgeQ_lGecNqwo";
async function rpc(fn, args){
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY }, body: JSON.stringify(args || {}) });
  if (!r.ok) { let m = ""; try { m = (await r.json()).message || ""; } catch {} throw new Error("Errore " + r.status + (m ? ": " + m : "")); }
  return r.json();
}
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const U = s => String(s || "").trim().toUpperCase();
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const oggi = () => iso(new Date());
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const itData = s => { const [y, m, d] = s.split("-"); return d + "." + m + "." + y; };
const giorno = s => GIORNI[new Date(s + "T12:00:00").getDay()];
const spostaGiorno = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const etichettaGiorno = s => { if (!s) return ""; const g = giorno(s), t = oggi(); return (s === t ? "Oggi · " : s === spostaGiorno(t, -1) ? "Ieri · " : "") + g.charAt(0).toUpperCase() + g.slice(1) + " " + itData(s); };
function aggData(v){ const t = oggi(); if (!v) v = t; if (v > t) v = t; const f = $("#fData"); f.value = v; S.edit.data = v; $("#dGiorno").textContent = etichettaGiorno(v); $("#dNext").disabled = v >= t; }
function toast(t){ const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 3200); }
function parseCant(label){ const s = String(label || "").trim().replace(/\s+/g, " "); const m = s.match(/(^|[^\d.])(\d{3,4}\.\d{2}(?:\.[A-Z]{1,4})?)(?![\d.])/i);
  let code = "", rest = s; if (m) { code = m[2].toUpperCase(); const k = m.index + m[1].length; rest = (s.slice(0, k) + " " + s.slice(k + m[2].length)).replace(/\s*[-–]\s*[-–]\s*/g, " - ").replace(/\s{2,}/g, " ").trim().replace(/^[\s\-–:·,;/_]+|[\s\-–:·,;/_]+$/g, ""); }
  return { code, rest }; }
const MSG = { PIN_ERRATO: "PIN errato.", DATA_NON_VALIDA: "Data non valida: puoi inserire rapportini degli ultimi 60 giorni.", NON_MODIFICABILE: "Questo rapportino è già stato approvato e non si può modificare." };
const msgErr = e => (e && e.startsWith && e.startsWith("BLOCCATO")) ? "Troppi tentativi: accesso " + e.toLowerCase().replace("bloccato", "bloccato") + "." : (MSG[e] || e || "Errore");

const S = { el: { operatori: [], cantieri: [], mezzi: [] }, me: null, pin: "", list: [], view: "login", edit: null, pinIn: "" };
try { S.calOpen = !!localStorage.getItem("za-rap-cal"); } catch {}
try { const m = JSON.parse(localStorage.getItem("za-rap-me") || "null"); if (m && m.nome && m.pin) { S.me = m.nome; S.pin = m.pin; } } catch {}

async function caricaElenchi(){ S.el = await rpc("rap_elenchi"); $("#dlCan").innerHTML = (S.el.cantieri || []).map(c => `<option value="${esc(c)}">`).join(""); $("#dlMez").innerHTML = (S.el.mezzi || []).map(c => `<option value="${esc(c)}">`).join(""); }
async function caricaMiei(){ const r = await rpc("rap_miei", { p_nome: S.me, p_pin: S.pin }); if (!r.ok) { esci(msgErr(r.err)); return false; } S.list = r.rapportini || []; return true; }
function esci(msg){ S.me = null; S.pin = ""; S.pinIn = ""; try { localStorage.removeItem("za-rap-me"); } catch {} S.view = "login"; render(); if (msg) toast(msg); }

function render(){
  const m = $("#main"); $("#fab").hidden = !(S.me && S.view === "lista");
  $("#me").hidden = !S.me; if (S.me) $("#me").innerHTML = `<b>${esc(S.me)}</b><button id="out">Esci</button>`;
  if (!S.me || S.view === "login") return renderLogin(m);
  if (S.view === "form") return renderForm(m);
  renderLista(m);
}
function renderLogin(m){
  const ops = S.el.operatori || [];
  m.innerHTML = `<h1>Accesso</h1><div class="card">
    <label class="l" for="op">Il tuo nome</label>
    <select class="f" id="op"><option value="">— Scegli il tuo nome —</option>${ops.map(o => `<option ${o === S.loginNome ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
    ${ops.length ? "" : `<p class="hint">Nessun operatore abilitato: chiedi in ufficio di assegnarti un PIN.</p>`}
    <label class="l">PIN (6 cifre)</label>
    <div class="pindots">${[0,1,2,3,4,5].map(i => `<i class="${i < S.pinIn.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="Cancella">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--accent);border-color:var(--accent);color:#1d1606">OK</button></div>
    <div id="lerr"></div></div>`;
}
/* calendario del mese */
function pasqua(y){ const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return new Date(y, mo - 1, da, 12); }
const FESTE = { "01-01": "Capodanno", "01-06": "Epifania", "04-25": "Liberazione", "05-01": "Festa del lavoro", "06-02": "Festa della Repubblica", "08-15": "Ferragosto", "11-01": "Ognissanti", "12-08": "Immacolata", "12-25": "Natale", "12-26": "S. Stefano" };
function festa(s){ if (FESTE[s.slice(5)]) return FESTE[s.slice(5)]; const p = pasqua(+s.slice(0, 4)); if (s === iso(p)) return "Pasqua"; p.setDate(p.getDate() + 1); return s === iso(p) ? "Pasquetta" : ""; }
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const PRIMO = () => { const lim = spostaGiorno(oggi(), -60), d = S.list.reduce((m, r) => r.data < m ? r.data : m, oggi()); return d > lim ? d : lim; }; // rosso solo dal primo rapportino dell'operaio (max 60 giorni)
function statoGiorno(s, perData){ const d = new Date(s + "T12:00:00"), wd = d.getDay(), rs = perData[s] || [];
  if (rs.length) { const f = rs.some(r => r.payload && r.payload.ferie), lav = rs.some(r => r.payload && !r.payload.ferie && r.payload.cantiere), pm = rs.some(r => r.payload && r.payload.permesso > 0);
    return f ? "fer" : lav ? (pm ? "ok perm" : "ok") : pm ? "perm" : "ok"; }
  if (wd === 0 || wd === 6 || festa(s)) return "off";
  if (s > oggi()) return "fut"; if (s < PRIMO()) return "old"; return "manca"; }
function mancanti(perData){ let n = 0; for (let s = PRIMO(); s <= oggi(); s = spostaGiorno(s, 1)) if (statoGiorno(s, perData) === "manca") n++; return n; }
function calHTML(perData){

function leggiForm(){ const E = S.edit, p = E.p; if (!$("#fData")) return;
  E.data = $("#fData").value; p.ferie = !!($("#fFerie") && $("#fFerie").checked); if (!p.ferie) delete p.ferie;
  const pm = $("#fPerm") ? +String($("#fPerm").value).replace(",", ".") || 0 : 0; if (pm > 0 && !p.ferie) p.permesso = pm; else delete p.permesso;
  if ($("#fCan")) { p.cantiere = $("#fCan").value.trim(); p.lavorazione = U($("#fLavz").value); if (!p.lavorazione) delete p.lavorazione; p.lavori = U($("#fLav").value); }
  p.note = $("#fNote").value.trim();
  document.querySelectorAll("[data-mz]").forEach(e => { const x = p.mezzi[+e.dataset.mz]; if (x) x[e.dataset.k] = e.dataset.k === "ore" ? e.value : U(e.value); });
  document.querySelectorAll("[data-ac]").forEach(e => { const [i, j] = e.dataset.ac.split("|").map(Number), x = p.mezzi[i]; if (!x) return; normMz(x); while (x.accs.length <= j) x.accs.push({ acc: "", ore: "" }); x.accs[j][e.dataset.k] = e.dataset.k === "ore" ? e.value : U(e.value); });
  p.ore = p.ferie ? 0 : calcOre(p);
  document.querySelectorAll("[data-mt]").forEach(e => { const x = p.materiali[+e.dataset.mt]; if (x) x[e.dataset.k] = e.dataset.k === "desc" ? U(e.value) : e.value; }); }

async function login(){
  const nome = $("#op") && $("#op").value; S.loginNome = nome;
  if (!nome) { $("#lerr").innerHTML = `<div class="err">Scegli il tuo nome.</div>`; return; }
  if (S.pinIn.length < 6) { $("#lerr").innerHTML = `<div class="err">Il PIN ha 6 cifre.</div>`; return; }
  $("#lerr").innerHTML = `<p class="hint">Verifica…</p>`;
  try { const r = await rpc("rap_login", { p_nome: nome, p_pin: S.pinIn });
    if (!r.ok) { S.pinIn = ""; render(); $("#lerr").innerHTML = `<div class="err">${esc(msgErr(r.err))}</div>`; return; }
    S.me = nome; S.pin = S.pinIn; S.pinIn = ""; try { localStorage.setItem("za-rap-me", JSON.stringify({ nome, pin: S.pin })); } catch {}
    await caricaMiei(); S.view = "lista"; render(); toast("Ciao " + nome + "!");
  } catch (e) { $("#lerr").innerHTML = `<div class="err">Connessione non riuscita. Controlla internet e riprova.</div>`; }
}
async function salva(){
  leggiForm(); const E = S.edit, p = E.p, er = $("#ferr");
  if (!E.data) { er.innerHTML = `<div class="err">Indica la data.</div>`; return; }
  if (p.ferie) { p.cantiere = ""; delete p.lavorazione; p.mezzi = []; p.materiali = []; p.lavori = ""; p.ore = 0; delete p.inizio; delete p.fine; delete p.pausa; }
  else {
    const soloPerm = p.permesso > 0 && !p.cantiere;
    if (soloPerm) { p.ore = 0; delete p.inizio; delete p.fine; delete p.pausa; }
    else {
      if (!p.cantiere) { er.innerHTML = `<div class="err">Indica il cantiere (oppure segna ferie o permesso).</div>`; $("#fCan").focus(); return; }
      if (!p.ore) { er.innerHTML = `<div class="err">Indica almeno una macchina con le ore.</div>`; return; }
    }
    delete p.inizio; delete p.fine; delete p.pausa;
    p.mezzi = (p.mezzi || []).map(x => { normMz(x); x.accs = x.accs.filter(a => a.acc || a.ore); if (!x.accs.length) delete x.accs; return x; }).filter(x => x.mezzo || x.ore || x.accs); p.materiali = (p.materiali || []).filter(x => x.desc || x.qta);
  }
  const b = $("#save"); b.disabled = true; b.textContent = "Salvataggio…";
  try { const r = await rpc("rap_salva", { p_nome: S.me, p_pin: S.pin, p_id: E.id, p_data: E.data, p_payload: p });
    if (!r.ok) { b.disabled = false; b.textContent = "Salva rapportino"; if (r.err === "PIN_ERRATO" || String(r.err).startsWith("BLOCCATO")) return esci(msgErr(r.err)); er.innerHTML = `<div class="err">${esc(msgErr(r.err))}</div>`; return; }
    await caricaMiei(); S.view = "lista"; S.edit = null; render(); window.scrollTo(0, 0); toast("Rapportino salvato.");
  } catch (e) { b.disabled = false; b.textContent = "Salva rapportino"; er.innerHTML = `<div class="err">Non salvato: connessione non riuscita. Riprova tra poco, i dati restano qui.</div>`; }
}
async function elimina(){
  const E = S.edit; if (!E.id) return;
  if (!S.confDel) { S.confDel = true; $("#del").textContent = "Tocca di nuovo per confermare l'eliminazione"; setTimeout(() => { S.confDel = false; const d = $("#del"); if (d) d.textContent = "Elimina rapportino"; }, 4000); return; }

    await caricaMiei(); S.view = "lista"; S.edit = null; render(); toast("Rapportino eliminato."); } catch { $("#ferr").innerHTML = `<div class="err">Connessione non riuscita.</div>`; }
}

/* suggerimenti grandi al posto della tendina del telefono */
const sugBox = document.createElement("div"); sugBox.className = "sug"; sugBox.hidden = true; let sugIn = null;
function evid(t, ws){ let h = esc(t); ws.forEach(w => { if (w) h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); }); return h; }
function mostraSug(inp){

  const all = (S.el && S.el[inp.dataset.sug]) || [], hit = all.filter(x => { const u = String(x).toUpperCase(); return ws.every(w => u.includes(w.replace(/&amp;/g, "&"))); }).slice(0, 60);
  inp.parentElement.appendChild(sugBox); sugIn = inp;
  sugBox.innerHTML = hit.length ? hit.map(x => { const i = String(x).indexOf(" : ");
    if (inp.dataset.sug === "cantieri" && i > 0) { const a = x.slice(0, i), b = x.slice(i + 3), j = a.indexOf(" - ");
      return `<button type="button" data-v="${esc(x)}">${j > 0 ? `<span class="c1">${evid(a.slice(0, j), ws)}</span><span class="c2">${evid(a.slice(j + 3), ws)}</span>` : `<span class="c2">${evid(a, ws)}</span>`}${evid(b, ws)}</button>`; }
    return `<button type="button" data-v="${esc(x)}"><span class="c2">${evid(x, ws)}</span></button>`; }).join("")

function autoH(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; }
function autoHTutti(){ document.querySelectorAll("textarea.grow").forEach(autoH); }

document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.sug) { if (/\n/.test(e.target.value)) e.target.value = e.target.value.replace(/\s*\n\s*/g, " "); autoH(e.target); mostraSug(e.target); } });

  if (t.dataset.delac) { leggiForm(); const [i, j] = t.dataset.delac.split("|").map(Number), x = normMz(S.edit.p.mezzi[i]); x.accs.splice(j, 1); render(); return; }
  if (t.dataset.delmz) { leggiForm(); S.edit.p.mezzi.splice(+t.dataset.delmz, 1); render(); return; }
  if (t.dataset.delmt) { leggiForm(); S.edit.p.materiali.splice(+t.dataset.delmt, 1); render(); return; }
  if (t.id === "save") return salva();
  if (t.id === "del") return elimina();
});
document.addEventListener("change", e => { if (e.target.id === "op") S.loginNome = e.target.value;
  if (e.target.id === "fFerie" && S.edit) { leggiForm(); if (S.edit.p.ferie) { S.edit.p.mezzi = S.edit.p.mezzi || []; } else { const q = S.edit.p; if (!(q.mezzi || []).length) q.mezzi = [{ mezzo: "", ore: "" }]; } render(); return; } if (e.target.id === "fData" && S.edit) aggData(e.target.value); });
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.mz != null && e.target.dataset.k === "ore" && S.edit && $("#oreTot")) { leggiForm(); $("#oreTot").textContent = fmtOre(S.edit.p.ore); } });
document.addEventListener("keydown", e => { if (S.view === "login" && !S.me) { if (/^\d$/.test(e.key) && S.pinIn.length < 6 && document.activeElement?.id !== "op") { S.pinIn += e.key; S.loginNome = $("#op")?.value; render(); if (S.pinIn.length === 6 && S.loginNome) login(); } else if (e.key === "Backspace") { S.pinIn = S.pinIn.slice(0, -1); render(); } else if (e.key === "Enter") login(); } });

(async () => {
  try { await caricaElenchi(); } catch (e) { $("#main").innerHTML = `<div class="card err">Impossibile collegarsi al server. Controlla la connessione e ricarica la pagina.</div>`; return; }
  if (S.me) { S.view = "lista"; try { if (!(await caricaMiei())) return; } catch { toast("Connessione lenta: riprova."); } }
  render();
})();
