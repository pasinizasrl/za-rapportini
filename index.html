function campiMancanti(p){
  document.querySelectorAll(".req").forEach(e => e.classList.remove("req"));

  const vuota = x => !x.mezzo && !num(x.ore) && !x.lav && !x.desc && !(x.accs || []).some(a => a.acc || a.ore);
  (p.mezzi || []).forEach((x, i) => { if (vuota(x) && p.mezzi.some(y => !vuota(y))) return; normMz(x);
    if (!x.mezzo) seg(q(i, "mezzo")); if (!num(x.ore)) seg(q(i, "ore")); if (!x.lav) seg(q(i, "lav")); if (!x.desc) seg(q(i, "desc"));
    x.accs.forEach((a, j) => { if (isBenna(a, j)) return; if (a.acc && !num(a.ore)) seg(q(i, "ore", j)); if (!a.acc && num(a.ore)) seg(q(i, "acc", j)); });
    if (x.radio != null && (!(num(x.radio) > 0) || num(x.radio) > num(x.ore))) seg(document.querySelector(`[data-radioh="${i}"]`)); });
  if (!(p.mezzi || []).length) seg($("#addMz"));
  if ($("#fOrd") && !fuori(p)) { if (String($("#fOrd").value).trim() === "") seg($("#fOrd")); if (!p.pasto) seg(document.querySelector(".pasto")); }
  return out; }
