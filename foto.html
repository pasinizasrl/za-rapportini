<!DOCTYPE html>

<head>

<style>
:root{

  --steel:#26393d; --steel-2:#304a4f; --on-steel:#eef3f1; --on-steel-muted:#a9bcb8;
  --accent:#d4950f; --accent-ink:#7a5000; --accent-soft:#f6e7c4; --band:#f4f08a;

}

}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}

.row{display:flex;gap:10px;align-items:center}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

.sugw{position:relative}

.dataNav{display:flex;gap:8px;align-items:stretch}
.assenze{display:flex;gap:10px;margin:10px 0 4px}

.mzR,.accR{align-items:flex-start !important}

.accErr{margin:8px 0 0 12px;font-size:14px}

.permR{color:var(--warn);font-weight:700;margin-top:4px}
.calTog{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;color:var(--ink);margin-bottom:10px;text-align:left}
.calTog .car{margin-left:auto;color:var(--muted)}
.calTog.on{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}

.cal{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 12px;margin-bottom:14px}

.cg{position:relative;aspect-ratio:1/1;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:inherit;font-weight:700;font-size:16px;color:var(--ink);padding:0}
.cg i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px}
.cg.ok{background:var(--good);border-color:var(--good);color:#fff}
.cg.manca{background:var(--bad);border-color:var(--bad);color:#fff}
.cg.fer{background:var(--blue);border-color:var(--blue);color:#fff}
.cg.perm{background:var(--warn);border-color:var(--warn);color:#fff}
.cg.ok.perm{background:var(--good);box-shadow:inset 0 -5px 0 var(--warn)}
.cg.fest{background:#efe3f7;border-color:#8a4fb3;color:#6a2d93}
.cg.chius{background:#dfe8f7;border-color:var(--blue);color:var(--blue);border-style:dashed}
.leg i.fest{background:#efe3f7;border:1px solid #8a4fb3}.leg i.chius{background:#dfe8f7;border:1px dashed var(--blue)}
.evM{margin-top:8px;font-size:13px;display:grid;gap:3px}
.evM i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.evM i.fest{background:#8a4fb3}.evM i.chius{background:var(--blue)}
.cg.off{background:transparent;color:var(--muted);border-style:dashed;opacity:.7}
.cg.fut{color:var(--muted);opacity:.45}
.cg.old{color:var(--muted)}
.cg.oggi{outline:3px solid var(--accent);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.leg i.ok{background:var(--good)}.leg i.manca{background:var(--bad)}.leg i.fer{background:var(--blue)}.leg i.perm{background:var(--warn)}.leg i.off{border:1px dashed var(--muted)}
.dataNav .f{flex:1 1 auto;min-width:0;text-align:center;font-weight:600}
.dnav{flex:0 0 54px;font-size:26px;line-height:1;padding:0;font-weight:700}
.dnav:disabled{opacity:.35}
.dGiorno{text-align:center;font-weight:600;color:var(--muted);margin:6px 0 4px;font-size:14px}
.row > *{flex:1 1 0;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1d1606}
.btn.big{width:100%;font-size:18px;min-height:54px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:12px}
.ok{background:var(--good-soft);color:var(--good)}
.tot{display:flex;justify-content:space-between;align-items:baseline;background:var(--band);color:#1c2320;border-radius:8px;padding:10px 14px;margin-top:12px;font-weight:700}
.tot b{font-family:var(--font-display);font-size:28px}
.sub{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:var(--panel2)}
.sub .row{margin-top:6px}
.x{flex:0 0 auto !important;width:44px;min-height:44px;border:0;background:none;color:var(--bad);font-size:20px}
.rap{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden;color:var(--ink)}
.rap{cursor:default}
.rapApri{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.detTog{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;font:inherit;font-weight:700;color:var(--ink);text-align:left;cursor:pointer}
.detTog b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1d1606;font-size:17px;line-height:1}
.det{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.detL{padding:8px 0;border-bottom:1px solid var(--line)}
.detL:last-child{border-bottom:0}
.detT{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.detT b{color:var(--ink);font-size:14px}
.detR{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.detR span:last-child{font-weight:700;white-space:nowrap}
.detR.acc{padding-left:12px;border-left:3px solid var(--accent);margin-left:2px;font-size:14px}
.detN{margin-top:8px;font-size:14px}
.det .ds{color:var(--blue);font-weight:700;text-transform:uppercase;margin-top:4px}
.rap .h{background:var(--steel);color:var(--on-steel);padding:9px 12px;display:flex;gap:8px;align-items:center;border-bottom:3px solid var(--accent)}
.rap .h .d{font-weight:700;text-transform:capitalize}

.rap .c{padding:10px 12px}
.rap .c .cm{font-weight:700;text-transform:uppercase}
.rap .c .ds{color:var(--blue);font-weight:700;text-transform:uppercase;margin-top:4px}
.chip{display:inline-block;border-radius:5px;padding:2px 8px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.wait{background:var(--accent-soft);color:var(--accent-ink)}
.code{font-family:var(--font-mono);font-size:12.5px;font-weight:500;background:var(--accent);color:#1c2320;border-radius:4px;padding:1px 6px;margin-right:6px}
.fotoG{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:10px}
.fotoT{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.fotoT img{width:100%;height:100%;object-fit:cover;display:block}
.fotoT a{display:block;width:100%;height:100%}
.fotoT small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;text-align:center;padding:2px}

.manc{background:var(--bad-soft);border:2px solid var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--bad)}

.mancB{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.listaH{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.listaH h1{margin:0;flex:1 1 auto}
.fab{flex:0 0 auto;min-height:44px;padding:8px 14px;font-size:15px;font-weight:700;white-space:nowrap}

.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.flt .f{flex:1 1 180px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{flex:1;border:0;background:none;padding:10px 8px;font:inherit;font-weight:600;color:var(--muted)}

.canC{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden;font:inherit;color:var(--ink);cursor:pointer}
.canC .t{padding:10px 12px;display:flex;gap:10px;align-items:center}

.code{font-family:var(--font-mono, "IBM Plex Mono", monospace);background:var(--accent);color:#1c2320;border-radius:4px;padding:0 5px;font-size:12px;margin-right:6px}

<body>
<header>
  <div><div class="b">ZA srl</div><div class="s">Foto cantieri</div></div>

<script>
const SB_URL = "https://mzyvermpfusbbufhjwbu.supabase.co", SB_KEY = "sb_publishable_P_r6pi6oRahzgvfwU-PgeQ_lGecNqwo";
async function rpc(fn, args){ const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY }, body: JSON.stringify(args || {}) }); if (!r.ok) throw new Error("Errore " + r.status); return r.json(); }
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(t){ const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 3200); }
function parseCant(label){ const s = String(label || "").trim().replace(/\s+/g, " "); const m = s.match(/(^|[^\d.])(\d{3,4}\.\d{2}(?:\.[A-Z]{1,4})?)(?![\d.])/i);
  let code = "", rest = s; if (m) { code = m[2].toUpperCase(); const k = m.index + m[1].length; rest = (s.slice(0, k) + " " + s.slice(k + m[2].length)).replace(/\s*[-–]\s*[-–]\s*/g, " - ").replace(/\s{2,}/g, " ").trim().replace(/^[\s\-–:·,;/_]+|[\s\-–:·,;/_]+$/g, ""); }

const S = { ops: [], me: null, pin: "", pinIn: "", righe: null, per: 30, q: "", can: null, lb: null };

function render(){

  R.forEach(r => { const k = r.cantiere || "SENZA CANTIERE"; (perCan[k] = perCan[k] || []).push(r); });

  m.innerHTML = `<h1>Foto cantieri</h1>
    <div class="flt"><div class="f"><input class="f" id="q" value="${esc(S.q)}" placeholder="Cerca cantiere, cliente o nome…" autocomplete="off"></div></div>
    <div class="seg" style="margin-bottom:12px">${[[7, "7 giorni"], [30, "30 giorni"], [90, "3 mesi"], [365, "1 anno"]].map(([v, l]) => `<button data-per="${v}" class="${S.per === v ? "on" : ""}">${l}</button>`).join("")}</div>
    ${cans.map(k => { const c = parseCant(k), L = perCan[k], ff = L.flatMap(r => r.foto || []);
      return `<button class="canC" data-can="${esc(k)}"><div class="t"><div>${c.code ? `<span class="code">${esc(c.code)}</span>` : ""}<span class="cm">${esc(c.rest || k)}</span><div class="hint">ultima: ${esc(giorno(L[0].data))} ${esc(itData(L[0].data))}</div></div><span class="n">📷 ${ff.length}</span></div>
        <div class="strip">${ff.slice(0, 6).map(f => f.th ? `<img src="${esc(f.th)}" alt="" loading="lazy">` : "").join("")}</div></button>`; }).join("") || `<div class="card empty">Nessuna foto nel periodo scelto.</div>`}`;
}
function renderCan(m, k, L){
  const c = parseCant(k), perG = {}; L.forEach(r => (perG[r.data] = perG[r.data] || []).push(r));
  const days = Object.keys(perG).sort().reverse(); S.lista = [];
  m.innerHTML = `<div class="row" style="margin-bottom:4px"><button class="btn ghost sm" id="back" style="flex:0 0 auto">‹ Tutti i cantieri</button></div>
    <h1 style="font-size:22px">${c.code ? `<span class="code" style="font-size:15px">${esc(c.code)}</span>` : ""}${esc(c.rest || k)}</h1>
    ${days.map(d => { const ff = perG[d].flatMap(r => (r.foto || []).map(f => Object.assign({ op: r.nome, data: d, can: k }, f)));
      return `<div class="giorno"><b>${esc(giorno(d))} ${esc(itData(d))}</b><span class="hint">${esc([...new Set(perG[d].map(r => r.nome))].join(", "))} · ${ff.length} foto</span>${ff[0] && ff[0].cartella ? `<a class="hint" href="${esc(ff[0].cartella)}" target="_blank" rel="noopener">📂 Drive</a>` : ""}</div>
        <div class="gal">${ff.map(f => { const i = S.lista.push(f) - 1; return `<button data-foto="${i}" aria-label="Apri foto">${f.th ? `<img src="${esc(f.th)}" alt="" loading="lazy">` : "📷"}</button>`; }).join("")}</div>`; }).join("")}`;
}
S.big = {};
/* cache sul telefono delle foto già viste (IndexedDB): la seconda volta si aprono subito */
const DBP = new Promise(ok => { try { const r = indexedDB.open("za-foto", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); } catch { ok(null); } });
async function cacheGet(id){ const db = await DBP; if (!db) return null; return new Promise(ok => { try { const q = db.transaction("f").objectStore("f").get(id); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); } catch { ok(null); } }); }
async function cachePut(id, v){ const db = await DBP; if (!db) return; try { db.transaction("f", "readwrite").objectStore("f").put(v, id); } catch {} }
const inCorso = {};
function caricaGrande(f){ const id = fileId(f); if (!id || S.big[id] || !S.fotoUrl) return Promise.resolve(); if (inCorso[id]) return inCorso[id];
  return inCorso[id] = (async () => {
    try { let v = await cacheGet(id);
      if (!v) { const r = await fetch(S.fotoUrl, { method: "POST", body: JSON.stringify({ azione: "leggi", nome: S.me, pin: S.pin, id }) }); const j = await r.json();
        if (!j.ok) throw new Error(j.err || "errore"); v = "data:" + (j.mime || "image/jpeg") + ";base64," + j.b64; cachePut(id, v); }
      S.big[id] = v; mostraGrande(f); }
    catch (e) { if (S.lb != null && S.lista[S.lb] === f) { const l = $("#lbLoad"); if (l) l.textContent = "Foto grande non disponibile" + (String(e.message).includes("NON_ABILITATO") ? ": non sei abilitato" : ""); } }
    finally { delete inCorso[id]; } })(); }
function mostraGrande(f){ if (S.lb == null || S.lista[S.lb] !== f) return; const v = S.big[fileId(f)], im = $("#lbImg"), l = $("#lbLoad"), dl = $("#lbDl");
  if (im && v) im.src = v; if (l) l.remove(); if (dl && v) { dl.href = v; dl.download = f.nome || "foto.jpg"; dl.hidden = false; } }
function precarica(){ [S.lb, S.lb + 1, S.lb - 1, S.lb + 2].forEach(i => { const f = S.lista[i]; if (f) caricaGrande(f); }); }
/* zoom e spostamento: rotella, doppio tocco, pizzico con due dita, trascinamento */
const Z = { s: 1, x: 0, y: 0 }, PT = new Map(); let pinch = null, pan = null, lastTap = 0;
function limiti(){ const im = $("#lbImg"), box = $("#lb .img"); if (!im || !box) return; const bw = box.clientWidth, bh = box.clientHeight, nw = im.naturalWidth || bw, nh = im.naturalHeight || bh, k = Math.min(bw / nw, bh / nh), dw = nw * k * Z.s, dh = nh * k * Z.s;
  const mx = Math.max(0, (dw - bw) / 2), my = Math.max(0, (dh - bh) / 2); Z.x = Math.max(-mx, Math.min(mx, Z.x)); Z.y = Math.max(-my, Math.min(my, Z.y)); }
function applicaZ(){ const im = $("#lbImg"); if (!im) return; if (Z.s <= 1) { Z.x = 0; Z.y = 0; } else limiti(); const zb = $("#zPct"); if (zb) zb.textContent = Math.round(Z.s * 100) + "%"; im.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`; im.style.cursor = Z.s > 1 ? "grab" : "zoom-in"; }
function zoomA(ns, cx, cy){ const box = $("#lb .img"); if (!box) return; const r = box.getBoundingClientRect(), px = (cx ?? r.left + r.width / 2) - (r.left + r.width / 2), py = (cy ?? r.top + r.height / 2) - (r.top + r.height / 2);
  ns = Math.max(.4, Math.min(8, ns)); if (Math.abs(ns - 1) < .06) ns = 1; const k = ns / Z.s; Z.x = px - (px - Z.x) * k; Z.y = py - (py - Z.y) * k; Z.s = ns; applicaZ(); }
function resetZ(){ Z.s = 1; Z.x = 0; Z.y = 0; }
document.addEventListener("wheel", e => { if (S.lb == null || !e.target.closest("#lb .img")) return; e.preventDefault(); zoomA(Z.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
document.addEventListener("dblclick", e => { if (S.lb == null || !e.target.closest("#lb .img") || e.target.closest("button")) return; zoomA(Z.s !== 1 ? 1 : 2.5, e.clientX, e.clientY); });
document.addEventListener("pointerdown", e => { if (S.lb == null || !e.target.closest("#lb .img") || e.target.closest("button")) return; PT.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PT.size === 2) { const [a, b] = [...PT.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: Z.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; pan = null; }
  else if (PT.size === 1) { pan = { x: e.clientX, y: e.clientY, zx: Z.x, zy: Z.y, t: Date.now() };
    if (e.pointerType === "touch") { const now = Date.now(); if (now - lastTap < 300) { zoomA(Z.s !== 1 ? 1 : 2.5, e.clientX, e.clientY); lastTap = 0; } else lastTap = now; } } });
document.addEventListener("pointermove", e => { if (!PT.has(e.pointerId)) return; PT.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && PT.size === 2) { const [a, b] = [...PT.values()]; zoomA(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, pinch.cx, pinch.cy); }
  else if (pan && Z.s > 1) { Z.x = pan.zx + e.clientX - pan.x; Z.y = pan.zy + e.clientY - pan.y; applicaZ(); } });
const fineP = e => { PT.delete(e.pointerId); if (PT.size < 2) pinch = null; if (!PT.size) pan = null; };
document.addEventListener("pointerup", fineP); addEventListener("resize", () => { if (S.lb != null) applicaZ(); }); document.addEventListener("pointercancel", fineP);
function schermoIntero(){ const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast("Schermo intero non disponibile su questo telefono: usa il pizzico per ingrandire."));
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); else toast("Schermo intero non disponibile su questo telefono: usa il pizzico per ingrandire."); }
function renderLb(){ let el = $("#lb"); if (S.lb == null) { if (el) el.remove(); document.body.style.overflow = ""; return; }
  const f = S.lista[S.lb]; if (!el) { el = document.createElement("div"); el.id = "lb"; el.className = "lb"; document.body.appendChild(el); document.body.style.overflow = "hidden"; }
  el.innerHTML = `<div class="top"><div class="i"><b>${esc(f.op)}</b> · ${esc(itData(f.data))}<br><span style="opacity:.8">${esc(f.can || "")}</span></div><a id="lbDl" ${S.big[fileId(f)] ? `href="${S.big[fileId(f)]}" download="${esc(f.nome || "foto.jpg")}"` : 'hidden'}title="Scarica" aria-label="Scarica">⬇</a><button data-zoom="-1" aria-label="Riduci">−</button><button data-fit="1" aria-label="Adatta allo schermo" title="Adatta allo schermo" id="zPct" style="font-size:13px;min-width:56px">${Math.round(Z.s * 100)}%</button><button data-zoom="1" aria-label="Ingrandisci">+</button><button data-fs="1" aria-label="Schermo intero">⛶</button><button data-lbx="1" aria-label="Chiudi">✕</button></div>
    <div class="img"><img src="${esc(S.big[fileId(f)] || f.th || "")}" alt="" id="lbImg" draggable="false">${f.timbro ? "" : `<div class="tmb"><b>${esc(f.can || "")}</b><br>${esc(itData(f.data))}  ·  ${esc(f.op)}</div>`}${S.big[fileId(f)] ? "" : `<div id="lbLoad" style="position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.8">Caricamento alta qualità…</div>`}${S.lb > 0 ? `<button class="nav p" data-lbm="-1" aria-label="Precedente">‹</button>` : ""}${S.lb < S.lista.length - 1 ? `<button class="nav n" data-lbm="1" aria-label="Successiva">›</button>` : ""}</div>
    <div class="cnt">${S.lb + 1} / ${S.lista.length} · tocca la % per adattare allo schermo</div>`;
  const im0 = $("#lbImg"); if (im0) im0.onload = applicaZ; applicaZ(); precarica();
}
function renderLogin(m){
  m.innerHTML = `<h1>Foto cantieri</h1><div class="card">
    <label class="l" for="op">Il tuo nome</label>
    <select class="f" id="op"><option value="">— Scegli il tuo nome —</option>${S.ops.map(o => `<option ${o === S.loginNome ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
    <label class="l">PIN (6 cifre)</label>
    <div class="pindots">${[0,1,2,3,4,5].map(i => `<i class="${i < S.pinIn.length ? "on" : ""}"></i>`).join("")}</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="Cancella">⌫</button><button data-k="0">0</button><button data-k="ok" style="background:var(--accent);border-color:var(--accent);color:#1d1606">OK</button></div>
    <div id="lerr"></div><p class="hint">Galleria riservata: serve l'abilitazione dall'ufficio.</p></div>`;
}
async function carica(){ const al = iso(new Date()), d = new Date(); d.setDate(d.getDate() - S.per);
  try { const r = await rpc("rap_foto", { p_nome: S.me, p_pin: S.pin, p_dal: iso(d), p_al: al });
    if (!r.ok) { const msg = msgErr(r.err); S.me = null; S.pin = ""; try { localStorage.removeItem("za-foto-me"); } catch {} render(); $("#lerr") && ($("#lerr").innerHTML = `<div class="err">${esc(msg)}</div>`); return false; }
    S.righe = r.righe || []; render(); return true; }
  catch (e) { $("#main").innerHTML = `<div class="card err">Connessione non riuscita. Riprova tra poco.</div>`; return false; } }
async function login(){ const nome = $("#op") && $("#op").value; S.loginNome = nome;
  if (!nome) { $("#lerr").innerHTML = `<div class="err">Scegli il tuo nome.</div>`; return; }
  if (S.pinIn.length < 6) { $("#lerr").innerHTML = `<div class="err">Il PIN ha 6 cifre.</div>`; return; }
  $("#lerr").innerHTML = `<p class="hint">Verifica…</p>`; S.me = nome; S.pin = S.pinIn; S.pinIn = ""; S.righe = null;

document.addEventListener("click", e => { const t = e.target.closest("button"); if (!t) return;
  if (t.id === "out") { S.me = null; S.pin = ""; S.righe = null; S.can = null; try { localStorage.removeItem("za-foto-me"); } catch {} render(); return; }
  if (t.dataset.k) { const k = t.dataset.k; if (k === "del") S.pinIn = S.pinIn.slice(0, -1); else if (k === "ok") return login(); else if (S.pinIn.length < 6) S.pinIn += k;

  if (t.id === "back") { S.can = null; render(); return; }
  if (t.dataset.fit) { resetZ(); applicaZ(); return; }

  if (t.dataset.fs) { schermoIntero(); return; }
  if (t.dataset.foto != null) { resetZ(); S.lb = +t.dataset.foto; renderLb(); return; }
  if (t.dataset.lbm) { resetZ(); S.lb = Math.max(0, Math.min(S.lista.length - 1, S.lb + +t.dataset.lbm)); renderLb(); return; }
  if (t.dataset.lbx) { resetZ(); S.lb = null; renderLb(); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); return; } });
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const p = e.target.selectionStart; render(); const i = $("#q"); if (i) { i.focus(); i.setSelectionRange(p, p); } } });
document.addEventListener("change", e => { if (e.target.id === "op") S.loginNome = e.target.value; });
document.addEventListener("keydown", e => { if (S.lb == null) return; if (e.key === "Escape") { S.lb = null; renderLb(); } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") { resetZ(); S.lb = Math.max(0, Math.min(S.lista.length - 1, S.lb + (e.key === "ArrowLeft" ? -1 : 1))); renderLb(); } });
let tx = null; document.addEventListener("touchstart", e => { if (S.lb != null && e.touches.length === 1 && Z.s <= 1) tx = e.touches[0].clientX; else tx = null; }, { passive: true });

(async () => { try { const el = await rpc("rap_elenchi"); S.ops = el.operatori || []; S.fotoUrl = el.foto_url || ""; } catch {} render(); if (S.me) carica(); })();
